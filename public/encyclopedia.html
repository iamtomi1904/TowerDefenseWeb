<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bách Khoa Toàn Thư · Ấn Thành</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#f5f0e4;
  --bg-sidebar:#ebe3d1;
  --bg-card:#fffdf8;
  --bg-active:#195c46;
  --ink:#1b2b23;
  --ink-muted:#576a5f;
  --emerald:#195c46;
  --emerald-light:#e2efe9;
  --gold:#b48125;
  --gold-soft:#f5e7c6;
  --border:#d5cab4;
  --border-strong:#bba985;
}
html,body{
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:var(--bg-page);
  color:var(--ink);
  font:13.5px/1.45 'Segoe UI',system-ui,-apple-system,sans-serif;
}
body{
  display:flex;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  height:54px;
  background:linear-gradient(180deg,#fffdf8 0%,#f1eadb 100%);
  border-bottom:1px solid var(--border-strong);
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-shrink:0;
  box-shadow:0 2px 10px rgba(27,43,35,.06);
}
.topbar-left,.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-link{
  display:inline-flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:var(--ink);
  font-weight:800;
  font-size:15px;
  letter-spacing:.03em;
}
.brand-emblem{
  width:32px;
  height:32px;
  border-radius:8px;
  background:linear-gradient(135deg,#1d6b52 0%,#124635 100%);
  color:#f9e5b4;
  display:grid;
  place-items:center;
  font-family:Georgia,serif;
  font-size:17px;
  font-weight:900;
  box-shadow:0 2px 6px rgba(25,92,70,.25);
}
.divider-v{width:1px;height:20px;background:var(--border-strong)}
.page-badge{
  background:var(--gold-soft);
  color:#7c540e;
  border:1px solid #d9b872;
  padding:3px 10px;
  border-radius:999px;
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.04em;
}
.nav-btn{
  background:var(--bg-card);
  color:var(--ink);
  border:1px solid var(--border-strong);
  padding:6px 13px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:700;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:.15s;
}
.nav-btn:hover{border-color:var(--emerald);color:var(--emerald);background:#fff}
.nav-btn.primary{
  background:linear-gradient(180deg,#1f6e54 0%,#15513d 100%);
  color:#fff;
  border-color:#124433;
  box-shadow:0 2px 8px rgba(25,92,70,.22);
}
.nav-btn.primary:hover{filter:brightness(1.07)}

/* MAIN SHELL: SIDEBAR + CONTENT VIEWER */
.codex-shell{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:280px minmax(0,1fr);
  overflow:hidden;
}

/* SIDEBAR */
.codex-sidebar{
  background:var(--bg-sidebar);
  border-right:1px solid var(--border-strong);
  display:flex;
  flex-direction:column;
  min-height:0;
  padding:12px;
  gap:10px;
}
.search-box{
  position:relative;
  flex-shrink:0;
}
.search-box input{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--border-strong);
  border-radius:8px;
  padding:8px 11px;
  color:var(--ink);
  font-size:12.5px;
  outline:none;
}
.search-box input:focus{border-color:var(--emerald);box-shadow:0 0 0 2px rgba(25,92,70,.15)}

.chapter-tabs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
  flex-shrink:0;
}
.chapter-pill{
  background:#dfd5bf;
  border:1px solid #c7b99c;
  color:#3c4f44;
  padding:5px 7px;
  border-radius:7px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  text-align:center;
  transition:.15s;
}
.chapter-pill:hover{background:#e9e1cf}
.chapter-pill.active{
  background:var(--emerald);
  color:#fff;
  border-color:var(--emerald);
}

.codex-nav-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding-right:3px;
}
.codex-group{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.codex-group-title{
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:#6c5b3b;
  padding:2px 6px;
}
.codex-item{
  background:rgba(255,253,248,.65);
  border:1px solid transparent;
  border-radius:9px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer;
  text-align:left;
  color:var(--ink);
  transition:.15s;
}
.codex-item:hover{
  background:var(--bg-card);
  border-color:var(--border-strong);
}
.codex-item.active{
  background:var(--bg-active);
  color:#fff;
  border-color:#0f3e2e;
  box-shadow:0 4px 12px rgba(25,92,70,.22);
}
.codex-icon{
  width:30px;
  height:30px;
  border-radius:7px;
  background:var(--gold-soft);
  color:#795310;
  display:grid;
  place-items:center;
  font-size:15px;
  flex-shrink:0;
}
.codex-item.active .codex-icon{
  background:rgba(255,255,255,.16);
  color:#fde6ad;
}
.codex-meta{min-width:0;flex:1}
.codex-meta strong{
  display:block;
  font-size:12.5px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.codex-meta span{
  display:block;
  font-size:11px;
  color:var(--ink-muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.codex-item.active .codex-meta span{color:#cbe6dc}

/* VIEWER STAGE */
.codex-stage{
  display:flex;
  flex-direction:column;
  min-height:0;
  background:var(--bg-card);
}
.stage-bar{
  height:44px;
  padding:0 16px;
  background:#f8f3e8;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-shrink:0;
}
.stage-info{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.stage-info h1{
  font-size:14.5px;
  font-weight:800;
  color:var(--emerald);
  white-space:nowrap;
}
.stage-info p{
  font-size:12px;
  color:var(--ink-muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stage-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.btn-open-raw{
  background:#fff;
  color:var(--emerald);
  border:1px solid var(--border-strong);
  padding:4px 10px;
  border-radius:6px;
  font-size:11.5px;
  font-weight:700;
  text-decoration:none;
}
.btn-open-raw:hover{border-color:var(--emerald);background:var(--emerald-light)}

.frame-wrap{
  flex:1;
  min-height:0;
  position:relative;
  background:#f8f4ea;
}
.codex-iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
}

@media(max-width:920px){
  .codex-shell{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr);
  }
  .codex-sidebar{
    border-right:none;
    border-bottom:1px solid var(--border-strong);
    padding:8px 12px;
    max-height:195px;
  }
  .codex-nav-list{
    flex-direction:row;
    overflow-x:auto;
    overflow-y:hidden;
    gap:8px;
    padding-bottom:4px;
  }
  .codex-group{
    flex-direction:row;
    align-items:center;
    gap:6px;
  }
  .codex-group-title{display:none}
  .codex-item{min-width:190px;padding:6px 9px}
}
@media(max-width:600px){
  .topbar{height:auto;padding:8px 12px;flex-wrap:wrap}
  .page-badge,.stage-info p{display:none}
}
</style>
</head>

    url: '/aura-stats.html'
  },

  // 2. QUÁI VẬT, THỦ LĨNH & QUÂN ĐOÀN

  },

  // 3. VẬT PHẨM, BẢN ĐỒ & PHÒNG LAB
  {

    url: '/world-atlas.html'

    desc: 'Quan sát trực tiếp bố cục cổng thành, đường quái đi và các bãi quái rừng trên từng bản đồ.',

  {

    sub: 'Thử nghiệm VFX, phép thuật & hạt',
    desc: 'Phòng thử nghiệm trực quan các hiệu ứng kỹ năng, vụ nổ nguyên tố và vòng phép.',
    url: '/effect-lab.html'
  }
];

const params = new URLSearchParams(location.search);
let activeId = ENTRIES.some(e => e.id === params.get('tab')) ? params.get('tab') : 'class-gallery';
let activeCat = 'all';
let searchQuery = '';

const navEl = document.getElementById('codex-nav');
const frameEl = document.getElementById('codex-frame');
const titleEl = document.getElementById('stage-title');
const descEl = document.getElementById('stage-desc');
const rawLinkEl = document.getElementById('stage-raw-link');

function selectEntry(id) {
  const entry = ENTRIES.find(e => e.id === id) || ENTRIES[0];
  activeId = entry.id;
  titleEl.textContent = `${entry.icon} ${entry.title}`;
  descEl.textContent = entry.desc;
  rawLinkEl.href = entry.url;
  if (frameEl.getAttribute('src') !== entry.url) {
    frameEl.setAttribute('src', entry.url);
  }
  const q = new URLSearchParams(location.search);
  q.set('tab', entry.id);
  history.replaceState(null, '', `/encyclopedia.html?${q.toString()}`);
  renderNav();
}

function renderNav() {
  const q = searchQuery.trim().toLowerCase();
  const filtered = ENTRIES.filter(e => {
    if (activeCat !== 'all' && e.cat !== activeCat) return false;
    if (!q) return true;
    return (
      e.title.toLowerCase().includes(q) ||
      e.sub.toLowerCase().includes(q) ||
      e.desc.toLowerCase().includes(q)
    );
  });

  const groups = new Map();
  for (const item of filtered) {
    if (!groups.has(item.group)) groups.set(item.group, []);
    groups.get(item.group).push(item);
  }

  navEl.innerHTML = '';
  for (const [groupName, items] of groups.entries()) {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'codex-group';
    groupDiv.innerHTML = `<div class="codex-group-title">${groupName}</div>`;
    for (const item of items) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `codex-item ${item.id === activeId ? 'active' : ''}`;
      btn.innerHTML = `
        <span class="codex-icon">${item.icon}</span>
        <span class="codex-meta">
          <strong>${item.title}</strong>
          <span>${item.sub}</span>
        </span>
      `;
      btn.addEventListener('click', () => selectEntry(item.id));
      groupDiv.appendChild(btn);
    }
    navEl.appendChild(groupDiv);
  }
}

document.getElementById('chapter-filters').addEventListener('click', e => {
  const btn = e.target.closest('.chapter-pill');
  if (!btn) return;
  document.querySelectorAll('.chapter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  renderNav();
});

document.getElementById('codex-search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderNav();
});

frameEl.addEventListener('load', () => {
  try {
    const doc = frameEl.contentDocument;
    if (!doc || !doc.head) return;
    if (!doc.getElementById('shared-home-template')) {
      const style = doc.createElement('style');
      style.id = 'shared-home-template';
      style.textContent = `
        :root {
          color-scheme: light !important;
          --bg: #f8f4ea !important;
          --panel: #fffdf9 !important;
          --surface: #fffdf9 !important;
          --card: #fffdf9 !important;
          --line: #dcd2be !important;
          --border: #c4b596 !important;
          --text: #192a21 !important;
          --ink: #192a21 !important;
          --muted: #56695e !important;
          --gold: #176148 !important;
        }
        body {
          background: #f8f4ea !important;
          color: #192a21 !important;
          font-family: "Segoe UI", system-ui, sans-serif !important;
        }
        body > header, body > footer { display: none !important; }
        h1, h2, h3, h4, strong, b, th { color: #192a21 !important; }
        p, small, span, td, li, label, .muted, .note, .sub { color: #4c5f54; }
        a { color: #176148 !important; }
        article, section.card, .card, .panel, .box, .item-card, .troop-card, .boss-card, .leader-card, .biome-card, .stat-card, aside {
          background: #fffdf9 !important;
          border-color: #c4b596 !important;
          color: #192a21 !important;
          box-shadow: 0 4px 14px rgba(25,42,33,.05) !important;
        }
        button, select, input {
          background: #fffdf9 !important;
          color: #192a21 !important;
          border: 1px solid #c4b596 !important;
          border-radius: 7px !important;
        }
        button[aria-pressed="true"], button.active, .tab.active {
          background: #176148 !important;
          color: #ffffff !important;
          border-color: #0f4532 !important;
        }
      `;
      doc.head.appendChild(style);
    }
  } catch {}
});

selectEntry(activeId);
</script>
</body>
