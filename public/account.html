<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hồ sơ · Ấn Thành</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="stylesheet" href="/bestiary.css">
<style>
.profile-card{
  background:var(--panel);
  padding:24px;
  border:1px solid var(--line-strong);
  border-radius:14px;
  margin:24px 0;
  box-shadow:0 4px 14px rgba(25,42,33,.05);
}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;overflow:hidden}
td,th{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line)}
.table-wrap{overflow-x:auto}
th{color:var(--emerald-deep);background:var(--panel-tint);font-weight:800}
.note{color:var(--muted);line-height:1.7}
h1{font-size:34px;margin:0 0 8px}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">THE WORLD · HỒ SƠ CHỈ HUY</a>
  <nav>
    <a href="/encyclopedia.html">Bách Khoa Toàn Thư</a>
    <a href="/lobby.html">Phòng Chờ Co-op</a>
    <a class="play" href="/defense.html">Vào chơi ↗</a>
  </nav>
</header>
<main>
  <section class="profile-card">
    <h1 id="profile-name">Hồ sơ chỉ huy</h1>
    <p id="profile-detail" class="note"></p>
    <p class="note">Lịch sử thuộc về tài khoản của bạn. Mỗi ván thủ thành mới bắt đầu cấp 1.</p>
  </section>
  <h2>Lịch sử chiến đấu</h2>
  <p id="history-message" role="status">Đang tải lịch sử…</p>
  <div class="table-wrap">
    <table hidden id="history-table">
      <thead>
        <tr><th>Thời gian</th><th>Phòng</th><th>Kết quả</th><th>Ải</th><th>Đợt</th><th>Độ khó</th><th>Hạ gục đội</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script type="module" src="/account.js"></script>
</body>
</html>
